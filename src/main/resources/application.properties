server.port=3000

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:aelp_station.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Dialect & DDL
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Automatic Schema & Data Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Static Content Configuration (Serve public/ directory)
spring.web.resources.static-locations=file:public/,classpath:/static/
